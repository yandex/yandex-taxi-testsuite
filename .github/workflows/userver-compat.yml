# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: (Ubuntu) Userver compat tests

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
    steps:
      - uses: actions/checkout@v2
      - name: clone userver
        run: |
          git clone https://github.com/userver-framework/userver
          pushd userver
          git checkout 64c4f7f5d289128f07db29baa207da976ff45ea6
          popd
      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip wheel virtualenv pytest
          python -m venv .venv
          .venv/bin/pip install \
            -r requirements-core.txt \
            -r requirements-dev.txt \
            -r userver/testsuite/requirements.txt \
            -r userver/testsuite/requirements-internal-tests.txt
      - name: Run userver testsuite tests
        run: |
          source .venv/bin/activate
          for case in chaos config metrics sql_coverage_empty sql_coverage_full; do
            PYTHONPATH="userver/testsuite/pytest_plugins/:$PYTHONPATH" pytest userver/testsuite/tests/$case
          done
      - name: Run mypy for userver testsuite tests
        run: |
          source .venv/bin/activate
          for case in chaos config metrics sql_coverage_empty sql_coverage_fullg; do
            PYTHONPATH="userver/testsuite/pytest_plugins/:$PYTHONPATH" mypy userver/testsuite/tests/$case
          done
