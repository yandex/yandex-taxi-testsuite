syntax = "proto3";

enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_ACTIVE = 1;
  STATUS_INACTIVE = 2;
  STATUS_PENDING = 3;
}

message Address {
  string city = 1;
  string country = 2;
  string zip_code = 3;
}

message Contact {
  string email = 1;
  string phone = 2;
  Address address = 3;
}

message SampleMessage {
  string first_name = 1;
  string last_name = 2;
  int32 item_count = 3;
  Status status = 4;
  optional string display_name = 5;
  optional int32 priority_level = 6;
  Contact contact = 7;
}
